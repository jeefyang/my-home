<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 · 多用户管理（管理员）</title>
<style>
  :root{
    --bg:#1d2230; --panel:#fff; --ink:#1f2430; --muted:#7b8496; --line:#e6e8ee;
    --brand:#2080f0; --danger:#d03050; --ok:#18a058; --soft:#f5f7fa; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px 24px 72px;
  }
  button{font:inherit;cursor:pointer}
  button:disabled{opacity:.42;cursor:not-allowed}
  .protohint{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#9aa6bf;font-size:12px;letter-spacing:.3px;z-index:20;white-space:nowrap}
  .phone{
    position:relative;width:390px;height:780px;max-height:calc(100vh - 96px);background:#fff;
    border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .topbar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#fff;z-index:5}
  .brand{font-weight:600;font-size:15px;letter-spacing:.2px}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;background:#eef1f6;color:#5b6475;border:1px solid #e1e6ef}
  .badge.admin{background:#e8f0fe;color:#1b62b8;border-color:#cfe0fb}
  .content{flex:1;overflow:auto;background:var(--soft);padding:14px 14px 92px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:14px}
  .card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
  .hero{background:linear-gradient(135deg,#ffffff 0%,#f4f8ff 100%);border-color:#dbe7fb}
  .hero-kicker{font-size:10px;letter-spacing:1.6px;color:var(--brand);font-weight:700;margin-bottom:5px}
  .hero h2{margin:0 0 5px;font-size:19px;letter-spacing:-.2px}
  .hero p{font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:11px;padding:5px 9px;border-radius:999px;background:#f4f6fa;color:#5d6879;border:1px solid #e9edf4}
  .toolbar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;
    background:rgba(20,28,45,.68);backdrop-filter:blur(20px) saturate(180%);
    border-radius:999px;padding:7px 10px;
    box-shadow:0 20px 35px -12px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.22) inset,0 0 0 1px rgba(80,140,255,.18);
  }
  .tool{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#dbe4f5;display:flex;align-items:center;justify-content:center;padding:0}
  .tool:hover{background:rgba(255,255,255,.12)}
  .tool.on{background:#fff;color:var(--brand)}
  .tool svg{width:19px;height:19px;display:block}
  .stage{position:absolute;inset:0;display:none}
  .stage.open{display:block}
  .stage.drawer{z-index:40}
  .stage.top{z-index:70}
  .scrim{position:absolute;inset:0;background:rgba(15,18,26,.45)}
  .panel{position:absolute;left:0;right:0;bottom:0;top:0;background:#fff;display:flex;flex-direction:column;z-index:1;overflow:hidden}
  .panel.sheet{top:auto;height:82%;border-radius:18px 18px 0 0}
  .panel.modal{left:16px;right:16px;top:10%;bottom:10%;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .panel.modal.compact{top:auto;bottom:16%;max-height:68%}
  .panel.modal.small{top:auto;bottom:28%;max-height:50%}
  .phead{flex:0 0 auto;min-height:56px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .phead-main{min-width:0;display:flex;flex-direction:column;gap:2px}
  .p-title{font-size:15px;font-weight:600;line-height:1.3}
  .p-sub{font-size:11px;color:var(--muted);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .spacer{flex:1}
  .pbody{flex:1;overflow:auto;padding:12px 14px 16px}
  .pfoot{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff}
  .icon-btn{width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
  .icon-btn:hover{background:var(--soft);color:var(--ink)}
  .icon-btn.danger{color:var(--danger)}
  .icon-btn:disabled{color:#c6cede}
  .user-row{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line)}
  .user-row:last-child{border-bottom:0}
  .user-row.is-me{background:#f7faff;box-shadow:inset 3px 0 0 var(--brand);border-radius:8px;padding-left:10px;padding-right:8px;border-bottom-color:#e8eef9}
  .avatar{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#eef1f6;color:#5b6475;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .avatar.admin{background:#e8f0fe;color:#1b62b8}
  .u-main{flex:1;min-width:0}
  .u-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
  .u-name{font-size:14px;font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:9px;line-height:1;padding:3px 5px;border-radius:999px;background:#f0f2f6;color:#6d7788;border:1px solid #e7ebf2;white-space:nowrap}
  .tag.admin{background:#e8f0fe;color:#1b62b8;border-color:#d3e2fb}
  .tag.me{background:#e8f8ef;color:#167a45;border-color:#ccefdc}
  .u-sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .u-sub code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;background:#f4f6fa;border:1px solid #e9edf4;border-radius:4px;padding:1px 4px;color:#4f5d70}
  .u-ops{display:flex;gap:1px;flex:0 0 auto}
  .empty-state{text-align:center;padding:26px 12px 12px;color:var(--muted)}
  .empty-state .big{font-size:34px;line-height:1;margin-bottom:10px;opacity:.7}
  .empty-state h3{margin:0 0 5px;color:var(--ink);font-size:14px}
  .empty-state p{margin:0;font-size:12px;line-height:1.6}
  .empty-banner{border:1px dashed #cfd9e8;background:#f8fbff;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:#5d6b7f;line-height:1.55}
  .empty-banner b{color:var(--ink)}
  .callout{border-radius:10px;padding:10px 11px;font-size:12px;line-height:1.65;margin:10px 0}
  .callout.info{background:#f0f7ff;border:1px solid #cfe4ff;color:#155a9c}
  .callout.warn{background:#fff8e8;border:1px solid #ffe2a8;color:#8a5a00}
  .callout.danger{background:#fff1f3;border:1px solid #ffd0d8;color:#a51d35}
  .callout code{font-family:ui-monospace,Consolas,monospace;font-size:11px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:13px;color:var(--ink);line-height:1.2}
  .btn:hover{background:#fafbfd}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#1b72d8}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger:hover{background:#b82745}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
  .btn.tiny{padding:5px 8px;font-size:11px;border-radius:7px}
  .btn.block{width:100%}
  .field{margin-bottom:14px}
  .field > label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#354052}
  .input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(32,128,240,.12)}
  .input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(208,48,80,.08)}
  .hint{font-size:11px;color:var(--muted);line-height:1.55;margin-top:5px}
  .errmsg{min-height:17px;color:var(--danger);font-size:12px;line-height:1.5;margin-top:8px}
  .seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--soft);border:1px solid #edf0f5}
  .seg-btn{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:12px;color:#6b7688;white-space:nowrap}
  .seg-btn.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(23,32,51,.1)}
  .readonly{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border:1px dashed #d8dfeb;border-radius:9px;padding:10px;font-size:12px}
  .readonly code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#3f4b5d;word-break:break-all}
  .radio-card{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer;background:#fff}
  .radio-card:hover{background:#fbfcfe}
  .radio-card.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(32,128,240,.1);background:#f8fbff}
  .radio-dot{width:16px;height:16px;flex:0 0 16px;border:2px solid #c6ceda;border-radius:50%;margin-top:1px}
  .radio-card.on .radio-dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
  .radio-card b{display:block;font-size:12px;margin-bottom:2px}
  .radio-card span{display:block;font-size:11px;color:var(--muted);line-height:1.5}
  .cred-row{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fafbfd}
  .cred-label{font-size:10px;color:var(--muted);letter-spacing:.3px;margin-bottom:4px}
  .cred-value{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
  .cred-value code{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;color:#263244}
  .danger-title{font-size:16px;font-weight:600;margin-bottom:8px}
  .danger-p{font-size:13px;line-height:1.7;color:#4b5567;margin:0 0 4px}
  .sk-row{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}
  .sk-avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 37%,#eef1f6 63%);background-size:400% 100%;animation:sk 1.2s ease infinite}
  .sk-lines{flex:1}
  .sk-line{height:9px;border-radius:5px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 37%,#eef1f6 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;margin-bottom:7px}
  .sk-line.short{width:55%}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%) translateY(8px);background:rgba(20,24,32,.92);color:#fff;font-size:12px;padding:8px 12px;border-radius:8px;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:82%;text-align:center;line-height:1.5}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .review{position:fixed;left:16px;top:16px;width:190px;background:rgba(255,255,255,.97);border:1px solid #dfe5ef;border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:100;font-size:12px}
  .review-title{font-weight:700;margin-bottom:7px;font-size:12px;color:#2c3748}
  .review label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;color:#5f6b7d;font-size:11px}
  .review select{max-width:112px;height:26px;border:1px solid #dfe5ef;border-radius:6px;background:#fff;font:inherit;font-size:11px;color:#2c3748;padding:0 4px}
  .review .review-note{margin-top:7px;padding-top:7px;border-top:1px solid #edf0f5;color:#8a94a6;font-size:10px;line-height:1.5}
  .variantbar{position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:6px;border-radius:12px;backdrop-filter:blur(6px);z-index:100}
  .variantbar button{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#cfd8ea;font-size:13px;font-weight:600}
  .variantbar button.on{background:#fff;color:#1f2430}
  .variantbar span{color:#cfd8ea;font-size:10px;padding:0 5px;white-space:nowrap}
  @media (max-width:900px){.review{display:none}.protohint{font-size:10px;white-space:normal;text-align:center;width:90%}}
</style>
</head>
<body>
<div class="protohint">原型 · 多用户管理（仅管理员）· 底部 A/B/C 切换，左侧可切视角与状态</div>
<div class="phone" id="phone">
  <div class="topbar">
    <span class="brand">My Home</span>
    <span class="badge" id="roleBadge">管理员</span>
  </div>
  <div class="content" id="content"></div>
  <div class="toolbar" id="toolbar"></div>
  <div id="drawer"></div>
  <div id="stage"></div>
  <div class="toast" id="toast"></div>
</div>

<div class="review">
  <div class="review-title">评审控制</div>
  <label>视角
    <select id="role">
      <option value="admin">管理员</option>
      <option value="user">普通用户</option>
    </select>
  </label>
  <label>状态
    <select id="state">
      <option value="normal">正常</option>
      <option value="empty">空列表</option>
      <option value="loading">加载中</option>
      <option value="error">加载失败</option>
      <option value="denied">无权限</option>
    </select>
  </label>
  <label>变体
    <select id="variant">
      <option value="A">A · 弹窗</option>
      <option value="B">B · 内联</option>
      <option value="C">C · 全屏</option>
    </select>
  </label>
  <label>模拟错误
    <select id="sim">
      <option value="">不模拟</option>
      <option value="403">403 非管理员</option>
      <option value="409-path">409 pathID 冲突</option>
      <option value="409-last">409 最后管理员</option>
      <option value="500">500 存储失败</option>
    </select>
  </label>
  <div class="review-note">状态选「无权限」可看服务端 403 的抽屉态；普通用户工具栏不显示入口。</div>
</div>

<div class="variantbar" id="variantbar">
  <button data-variant="A">A</button>
  <button data-variant="B">B</button>
  <button data-variant="C">C</button>
  <span>A 弹窗 / B 内联 / C 全屏</span>
</div>

<script>
(function(){
  "use strict";

  var SVG = {
    users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.1"/><path d="M3.5 19c0-3 2.4-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/><path d="M16 5.5a3 3 0 0 1 0 5.8"/><path d="M17.5 13.9c2.1.5 3.5 2.2 3.5 4.4"/></svg>',
    page:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h8l4 4V20.5H6Z"/><path d="M14 3.5v4h4"/><path d="M9 12h6M9 15.5h6"/></svg>',
    nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9Z"/></svg>',
    control:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
    router:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7h6a3 3 0 0 1 3 3v4a3 3 0 0 0 3 3h4"/><path d="m17 14 3 3-3 3"/><circle cx="4" cy="7" r="1.4"/></svg>',
    cookie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12.5A8 8 0 1 1 11.5 4a3.5 3.5 0 0 0 4.4 4.4A3.5 3.5 0 0 0 20 12.5Z"/><circle cx="8.5" cy="10" r=".8" fill="currentColor"/><circle cx="11" cy="15" r=".8" fill="currentColor"/><circle cx="15.5" cy="13" r=".8" fill="currentColor"/></svg>',
    login:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5"/><path d="M13 8l4 4-4 4"/><path d="M9 12h8"/></svg>'
  };

  var seed = [
    {uuid:'u1', name:'林', pathID:'lin_admin', type:'admin', createTime:'2025-08-12', pageCount:4, isMe:true},
    {uuid:'u2', name:'小满', pathID:'xiaoman_01', type:'user', createTime:'2025-09-03', pageCount:2},
    {uuid:'u3', name:'阿哲', pathID:'azhe_admin', type:'admin', createTime:'2025-10-21', pageCount:3},
    {uuid:'u4', name:'访客', pathID:'guest_2025', type:'user', createTime:'2025-11-02', pageCount:0}
  ];

  var params = new URLSearchParams(location.search);
  var S = {
    users: JSON.parse(JSON.stringify(seed)),
    role: 'admin',
    state: 'normal',
    variant: 'A',
    sim: '',
    open: false,
    stage: null,
    form: null,
    reset: null,
    credential: null,
    deleteId: null,
    deleteError: ''
  };

  var qv = (params.get('v') || 'A').toUpperCase();
  if (qv === 'A' || qv === 'B' || qv === 'C') S.variant = qv;
  var qr = params.get('role');
  if (qr === 'admin' || qr === 'user') S.role = qr;
  var qs = params.get('state');
  if (qs === 'normal' || qs === 'empty' || qs === 'loading' || qs === 'error' || qs === 'denied') S.state = qs;
  S.open = params.get('open') === '1' || S.state !== 'normal';

  var $ = function(id){ return document.getElementById(id); };
  function esc(value){
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  function clone(value){ return JSON.parse(JSON.stringify(value)); }
  function getUser(uuid){ for (var i=0;i<S.users.length;i++){ if (S.users[i].uuid === uuid) return S.users[i]; } return null; }
  function getMe(){ for (var i=0;i<S.users.length;i++){ if (S.users[i].isMe) return S.users[i]; } return S.users[0]; }
  function adminCount(){ return S.users.filter(function(u){ return u.type === 'admin'; }).length; }
  function initial(name){ var chars = Array.from((name || '').trim()); return chars[0] || '?'; }
  function today(){ return new Date().toISOString().slice(0, 10); }
  function randomCode(n){
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var out = '';
    var seedBytes = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(seedBytes);
    for (var i=0;i<n;i++){
      var v = seedBytes[i] ? seedBytes[i] : Math.floor(Math.random() * 256);
      out += chars[v % chars.length];
    }
    return out;
  }
  function randomPathID(){ return 'user_' + randomCode(9).toLowerCase(); }

  function toast(message){
    var el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function(){ el.classList.remove('show'); }, 1900);
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('已复制'); }).catch(function(){ fallbackCopy(text); });
      return;
    }
    fallbackCopy(text);
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制'); }
    catch (e) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }

  function visibleUsers(){
    if (S.state === 'empty') return S.users.filter(function(u){ return u.isMe; });
    return S.users;
  }
  function sortedUsers(list){
    return list.slice().sort(function(a,b){
      if (a.type !== b.type) return a.type === 'admin' ? -1 : 1;
      return a.createTime < b.createTime ? -1 : 1;
    });
  }

  function renderContent(){
    var me = getMe();
    var admin = S.role === 'admin';
    $('roleBadge').textContent = admin ? '管理员' : '普通用户';
    $('roleBadge').className = 'badge' + (admin ? ' admin' : '');
    $('content').innerHTML =
      '<div class="card hero"><div class="hero-kicker">MY HOME</div>' +
        '<h2>下午好，' + esc(me ? me.name : '') + '</h2>' +
        '<p>' + (admin ? '你是管理员，底部工具栏最左侧的双人图标可以管理用户。' : '普通用户视角：工具栏不显示用户管理入口。') + '</p>' +
      '</div>' +
      '<div class="card"><h3>快捷入口</h3><p>这里只放页面占位，方便看清底部工具栏与抽屉的关系。</p>' +
        '<div class="chips"><span class="chip">书签</span><span class="chip">搜索</span><span class="chip">收藏</span><span class="chip">设置</span></div>' +
      '</div>' +
      '<div class="card"><h3>本轮要确认</h3><p>A 弹窗表单 / B 抽屉内联 / C 全屏分步；入口是否继续占工具栏第一格；凭据一次性展示是否够醒目。</p></div>';
  }

  function renderToolbar(){
    var tools = [
      {id:'users', label:'用户管理', svg:SVG.users, adminOnly:true},
      {id:'page', label:'页面设置', svg:SVG.page},
      {id:'nav', label:'导航管理', svg:SVG.nav},
      {id:'control', label:'项目设置', svg:SVG.control},
      {id:'router', label:'路由设置', svg:SVG.router},
      {id:'cookie', label:'缓存设置', svg:SVG.cookie},
      {id:'login', label:'登录', svg:SVG.login}
    ];
    var html = '';
    for (var i=0;i<tools.length;i++){
      var t = tools[i];
      if (t.adminOnly && (S.role !== 'admin' || S.state === 'denied')) continue;
      html += '<button class="tool' + (t.id === 'users' && S.open ? ' on' : '') + '" data-tool="' + t.id + '" title="' + t.label + '" aria-label="' + t.label + '">' + t.svg + '</button>';
    }
    $('toolbar').innerHTML = html;
  }

  function listHeader(){
    var adminTotal = adminCount();
    var sub = S.state === 'loading' ? '正在加载…' :
      (S.state === 'error' ? '加载失败' :
      (S.state === 'denied' ? '无权限' : '共 ' + S.users.length + ' 人 · ' + adminTotal + ' 名管理员'));
    return '<div class="phead"><div class="phead-main"><div class="p-title">用户管理</div><div class="p-sub">' + sub + '</div></div>' +
      '<span class="spacer"></span><button class="icon-btn" data-act="close-drawer" title="关闭" aria-label="关闭">✕</button></div>';
  }

  function userRow(u){
    var me = !!u.isMe;
    return '<div class="user-row' + (me ? ' is-me' : '') + '">' +
      '<div class="avatar' + (u.type === 'admin' ? ' admin' : '') + '">' + esc(initial(u.name)) + '</div>' +
      '<div class="u-main">' +
        '<div class="u-top"><span class="u-name">' + esc(u.name) + '</span>' +
          (me ? '<span class="tag me">我</span>' : '') +
          '<span class="tag ' + u.type + '">' + (u.type === 'admin' ? '管理员' : '用户') + '</span>' +
        '</div>' +
        '<div class="u-sub"><code>' + esc(u.pathID) + '</code><span>' + esc(u.createTime) + '</span><span>' + u.pageCount + ' 个页面</span></div>' +
      '</div>' +
      '<div class="u-ops">' +
        '<button class="icon-btn" data-edit="' + u.uuid + '" title="编辑" aria-label="编辑">✎</button>' +
        '<button class="icon-btn danger" data-del="' + u.uuid + '" title="' + (me ? '不能删除自己' : '删除') + '" aria-label="删除"' + (me ? ' disabled' : '') + '>🗑</button>' +
      '</div>' +
    '</div>';
  }

  function skeleton(){
    var row = '<div class="sk-row"><div class="sk-avatar"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line short"></div></div></div>';
    return row + row + row;
  }

  function errorState(){
    return '<div class="empty-state"><div class="big">!</div><h3>加载失败</h3><p>无法读取用户列表，请检查网络或稍后重试。</p>' +
      '<button class="btn" data-act="retry" style="margin-top:12px">重新加载</button></div>';
  }

  function deniedState(){
    return '<div class="empty-state"><div class="big">🔒</div><h3>没有管理员权限</h3><p>只有管理员可以查看和管理用户。<br>普通用户的工具栏不会显示这个入口。</p>' +
      '<button class="btn" data-act="close-drawer" style="margin-top:12px">关闭</button></div>';
  }

  function emptyBanner(){
    return '<div class="empty-banner"><b>只有你一个管理员。</b><br>新增用户或管理员后，他们会出现在这里。</div>';
  }

  function listBody(){
    if (S.state === 'loading') return skeleton();
    if (S.state === 'error') return errorState();
    if (S.state === 'denied') return deniedState();
    var list = sortedUsers(visibleUsers());
    var html = '';
    if (list.length <= 1) html += emptyBanner();
    html += list.map(userRow).join('');
    return html;
  }

  function listFooter(){
    if (S.state === 'loading' || S.state === 'error' || S.state === 'denied') return '';
    return '<div class="pfoot"><button class="btn primary block" data-act="add">＋ 新增用户</button></div>';
  }

  function stepTitle(){
    if (S.stage === 'form') return S.form && S.form.mode === 'edit' ? '编辑用户' : '新增用户';
    if (S.stage === 'reset') return '重置二次码';
    if (S.stage === 'credential' && S.credential) return S.credential.title;
    return '';
  }
  function stepSub(){
    if (S.stage === 'form') return S.form && S.form.mode === 'edit' ? '修改名称或角色' : '创建后立即生效';
    if (S.stage === 'reset') return '新码只显示一次';
    if (S.stage === 'credential') return '请立即复制并交付';
    return '';
  }
  function stepHeader(){
    var back = S.variant === 'A' ? '' : '<button class="icon-btn" data-act="back" title="返回" aria-label="返回">←</button>';
    var closeAction = S.variant === 'A' ? 'close-stage' : 'close-drawer';
    return '<div class="phead">' + back + '<div class="phead-main"><div class="p-title">' + stepTitle() + '</div><div class="p-sub">' + stepSub() + '</div></div>' +
      '<span class="spacer"></span><button class="icon-btn" data-act="' + closeAction + '" title="关闭" aria-label="关闭">✕</button></div>';
  }

  function formBody(){
    var f = S.form;
    if (!f) return '';
    var target = f.mode === 'edit' ? getUser(f.uuid) : null;
    var self = !!(target && target.isMe);
    var html = '';
    html += '<div class="field"><label for="f-name">名称</label><input id="f-name" class="input" maxlength="50" value="' + esc(f.name) + '" placeholder="留空按类型默认">' +
      '<div class="hint">1–50 个字符，允许重名。' + (f.mode === 'create' ? '留空时管理员默认“管理员”、用户默认“用户”。' : '') + '</div></div>';
    html += '<div class="field"><label>类型</label><div class="seg">' +
      '<button class="seg-btn' + (f.type === 'user' ? ' on' : '') + '" data-type="user"' + (self ? ' disabled' : '') + '>用户</button>' +
      '<button class="seg-btn' + (f.type === 'admin' ? ' on' : '') + '" data-type="admin"' + (self ? ' disabled' : '') + '>管理员</button>' +
      '</div>' + (self ? '<div class="hint">不能修改自己的类型。</div>' : '<div class="hint">管理员可以管理其他管理员，但至少保留一个管理员。</div>') + '</div>';
    if (f.mode === 'create'){
      html += '<div class="field"><label for="f-path">pathID（可选）</label><input id="f-path" class="input" value="' + esc(f.pathID) + '" placeholder="留空自动生成；8–20 位">' +
        '<div class="hint">字母、数字、下划线、中划线；创建后不可修改。</div></div>';
      html += '<div class="field"><label>二次码</label><div class="seg">' +
        '<button class="seg-btn' + (f.codeMode === 'none' ? ' on' : '') + '" data-code-mode="none">留空</button>' +
        '<button class="seg-btn' + (f.codeMode === 'manual' ? ' on' : '') + '" data-code-mode="manual">手填</button>' +
        '<button class="seg-btn' + (f.codeMode === 'random' ? ' on' : '') + '" data-code-mode="random">随机生成</button>' +
        '</div>';
      if (f.codeMode === 'manual') html += '<input id="f-code" class="input" style="margin-top:8px" value="' + esc(f.code) + '" placeholder="输入二次码">';
      if (f.codeMode === 'random') html += '<div class="hint">提交时生成 12 位，只显示一次。</div>';
      if (f.codeMode === 'none') html += '<div class="hint">不设二次码；之后可在编辑里重置。</div>';
      html += '</div>';
    } else {
      html += '<div class="field"><label>pathID</label><div class="readonly"><code>' + esc(target ? target.pathID : '') + '</code><span class="hint" style="margin:0">创建后不可修改</span></div></div>';
      html += '<div class="field"><label>二次码</label><div class="readonly"><span>••••••</span><span class="hint" style="margin:0">不显示，只可重置</span></div>';
      if (self){
        html += '<div class="hint">自己的二次码请到「路由设置」修改。</div>';
      } else {
        html += '<button class="btn tiny" data-act="open-reset" style="margin-top:8px">重置二次码</button>';
      }
      html += '</div>';
    }
    html += '<div class="errmsg">' + (f.error ? esc(f.error) : '') + '</div>';
    return html;
  }

  function resetBody(){
    var r = S.reset;
    if (!r) return '';
    var u = getUser(r.uuid);
    if (!u) return '';
    function card(mode, title, desc){
      return '<div class="radio-card' + (r.mode === mode ? ' on' : '') + '" data-reset-mode="' + mode + '">' +
        '<span class="radio-dot"></span><span><b>' + title + '</b><span>' + desc + '</span></span></div>';
    }
    var html = '<div class="callout info">为 <b>' + esc(u.name) + '</b> 设置二次码；pathID <code>' + esc(u.pathID) + '</code> 不变。</div>';
    html += card('random', '随机生成（推荐）', '服务端生成 12 位，提交后只显示一次。');
    html += card('manual', '手动输入', '自己指定，提交后只显示一次。');
    html += card('clear', '清除二次码', '对方登录不再需要二次码。');
    if (r.mode === 'manual') html += '<input id="r-code" class="input" style="margin-top:8px" value="' + esc(r.code) + '" placeholder="输入新的二次码">';
    html += '<div class="callout warn">重置后旧码立即失效，对方下一次请求需要重新登录。新码不会在列表或编辑页回显。</div>';
    html += '<div class="errmsg">' + (r.error ? esc(r.error) : '') + '</div>';
    return html;
  }

  function credentialBody(){
    var c = S.credential;
    if (!c) return '';
    function row(label, value){
      return '<div class="cred-row"><div class="cred-label">' + label + '</div><div class="cred-value"><code>' + esc(value) + '</code>' +
        '<button class="btn tiny" data-copy="' + esc(value) + '">复制</button></div></div>';
    }
    var html = '<div class="callout danger">请立即复制并交给用户。关闭后不再显示，列表和编辑页也不会回显。</div>';
    html += row('pathID', c.pathID);
    if (c.secondCode) html += row('二次码', c.secondCode);
    else html += '<div class="cred-row"><div class="cred-label">二次码</div><div class="cred-value"><span class="hint" style="margin:0">未设置</span></div></div>';
    html += '<button class="btn block" data-act="copy-all" style="margin-top:4px">复制全部</button>';
    html += '<div class="hint" style="margin-top:10px">用户：' + esc(c.name) + ' · 类型：' + (c.type === 'admin' ? '管理员' : '用户') + '</div>';
    return html;
  }

  function stepBody(){
    if (S.stage === 'form') return formBody();
    if (S.stage === 'reset') return resetBody();
    if (S.stage === 'credential') return credentialBody();
    return '';
  }

  function stepFooter(){
    var cancelAction = S.variant === 'A' ? 'close-stage' : 'back';
    if (S.stage === 'form'){
      return '<button class="btn" data-act="' + cancelAction + '">取消</button>' +
        '<button class="btn primary" data-act="save-form" style="flex:1"' + (S.form && S.form.busy ? ' disabled' : '') + '>' +
        (S.form && S.form.busy ? '保存中…' : (S.form && S.form.mode === 'edit' ? '保存' : '创建用户')) + '</button>';
    }
    if (S.stage === 'reset'){
      return '<button class="btn" data-act="' + cancelAction + '">取消</button><button class="btn primary" data-act="save-reset" style="flex:1">确认重置</button>';
    }
    if (S.stage === 'credential'){
      return '<button class="btn primary block" data-act="finish-credential">我已保存，关闭</button>';
    }
    return '';
  }

  function renderDrawer(){
    var drawer = $('drawer');
    if (!S.open){ drawer.innerHTML = ''; return; }
    var isStep = S.variant !== 'A' && (S.stage === 'form' || S.stage === 'reset' || S.stage === 'credential');
    var panelClass = isStep ? (S.variant === 'C' ? 'panel' : 'panel sheet') : 'panel sheet';
    var header = isStep ? stepHeader() : listHeader();
    var body = isStep ? stepBody() : listBody();
    var footer = isStep ? stepFooter() : listFooter();
    drawer.innerHTML = '<div class="stage drawer open"><div class="scrim" data-act="close-drawer"></div><div class="' + panelClass + '">' +
      header + '<div class="pbody">' + body + '</div>' + footer + '</div></div>';
  }

  function deleteStage(){
    var u = S.deleteId ? getUser(S.deleteId) : null;
    if (!u) return '';
    return '<div class="stage top open"><div class="scrim" data-act="close-stage"></div><div class="panel modal small">' +
      '<div class="phead"><div class="phead-main"><div class="p-title">删除用户</div><div class="p-sub">不可恢复</div></div><span class="spacer"></span>' +
      '<button class="icon-btn" data-act="close-stage" title="关闭" aria-label="关闭">✕</button></div>' +
      '<div class="pbody"><div class="danger-title">删除「' + esc(u.name) + '」？</div>' +
      '<p class="danger-p">该用户有 <b>' + u.pageCount + '</b> 个页面。删除账号会同时删除这些页面及页面内全部组件数据，<b>不可恢复</b>。</p>' +
      '<div class="callout danger">账号目录会先删除；若页面清理失败，结果里会返回 warning，不会回滚账号。</div>' +
      '<div class="errmsg">' + (S.deleteError ? esc(S.deleteError) : '') + '</div></div>' +
      '<div class="pfoot"><button class="btn" data-act="close-stage">取消</button><button class="btn danger" data-act="confirm-delete" style="flex:1">删除用户</button></div>' +
      '</div></div>';
  }

  function renderTopStage(){
    var stage = $('stage');
    if (S.stage === 'delete'){ stage.innerHTML = deleteStage(); return; }
    if (S.variant !== 'A' || !S.stage){ stage.innerHTML = ''; return; }
    var compact = S.stage === 'credential' ? ' compact' : '';
    stage.innerHTML = '<div class="stage top open"><div class="scrim" data-act="close-stage"></div><div class="panel modal' + compact + '">' +
      stepHeader() + '<div class="pbody">' + stepBody() + '</div>' + stepFooter() + '</div></div>';
  }

  function updateControls(){
    $('role').value = S.role;
    $('state').value = S.state;
    $('variant').value = S.variant;
    $('sim').value = S.sim;
    var buttons = document.querySelectorAll('#variantbar [data-variant]');
    for (var i=0;i<buttons.length;i++) buttons[i].classList.toggle('on', buttons[i].getAttribute('data-variant') === S.variant);
  }

  function render(){
    renderContent();
    renderToolbar();
    renderDrawer();
    renderTopStage();
    updateControls();
  }

  function closeDrawer(){
    S.open = false;
    S.stage = null;
    S.form = null;
    S.reset = null;
    S.credential = null;
    S.deleteId = null;
    S.deleteError = '';
    render();
  }

  function openDrawer(){
    if (S.role !== 'admin'){ toast('只有管理员可以打开用户管理'); return; }
    S.open = true;
    S.stage = null;
    render();
  }

  function openCreate(){
    if (S.state === 'loading' || S.state === 'error' || S.state === 'denied') return;
    S.form = {mode:'create', uuid:'', name:'', type:'user', pathID:'', codeMode:'none', code:'', error:'', busy:false};
    S.stage = 'form';
    render();
  }

  function openEdit(uuid){
    var u = getUser(uuid);
    if (!u) return;
    S.form = {mode:'edit', uuid:u.uuid, name:u.name, type:u.type, pathID:u.pathID, codeMode:'none', code:'', error:'', busy:false};
    S.stage = 'form';
    render();
  }

  function openDelete(uuid){
    var u = getUser(uuid);
    if (!u) return;
    if (u.isMe){ toast('不能删除自己'); return; }
    if (u.type === 'admin' && adminCount() <= 1){ toast('至少保留一个管理员'); return; }
    S.deleteId = uuid;
    S.deleteError = '';
    S.stage = 'delete';
    render();
  }

  function openReset(){
    if (!S.form || S.form.mode !== 'edit') return;
    var u = getUser(S.form.uuid);
    if (!u || u.isMe) return;
    S.reset = {uuid:u.uuid, mode:'random', code:'', error:''};
    S.stage = 'reset';
    render();
  }

  function simMessage(){
    if (S.sim === '403') return '没有管理员权限（403）';
    if (S.sim === '409-path') return 'pathID 已存在（409）';
    if (S.sim === '409-last') return '至少保留一个管理员（409）';
    if (S.sim === '500') return '保存失败，请重试（500）';
    return '';
  }

  function saveForm(){
    var f = S.form;
    if (!f || f.busy) return;
    var name = (f.name || '').trim();
    if (f.mode === 'create' && !name) name = f.type === 'admin' ? '管理员' : '用户';
    if (!name){ f.error = '名称不能为空'; render(); return; }
    if (Array.from(name).length > 50){ f.error = '名称最多 50 个字符'; render(); return; }
    var path = (f.pathID || '').trim();
    if (f.mode === 'create' && path && !/^[a-zA-Z0-9_-]{8,20}$/.test(path)){
      f.error = 'pathID 只能包含字母、数字、下划线、中划线，且 8–20 位';
      render();
      return;
    }
    if (f.mode === 'create' && path){
      for (var i=0;i<S.users.length;i++){
        if (S.users[i].pathID === path){ f.error = 'pathID 已存在（409）'; render(); return; }
      }
    }
    if (f.mode === 'create' && f.codeMode === 'manual' && !f.code){
      f.error = '请输入二次码，或改选留空/随机生成';
      render();
      return;
    }
    if (S.sim){ f.error = simMessage(); render(); return; }
    f.busy = true;
    f.error = '';
    render();
    setTimeout(function(){
      if (S.form !== f || S.stage !== 'form') return;
      f.busy = false;
      if (S.sim){ f.error = simMessage(); render(); return; }
      if (f.mode === 'create'){
        var code = f.codeMode === 'random' ? randomCode(12) : (f.codeMode === 'manual' ? f.code : '');
        var u = {uuid:'u' + Date.now(), name:name, pathID:path || randomPathID(), type:f.type, createTime:today(), pageCount:0, isMe:false};
        if (code) u.secondCode = code;
        S.users.push(u);
        if (S.state === 'empty') S.state = 'normal';
        S.credential = {mode:'create', title:'创建成功', name:u.name, type:u.type, pathID:u.pathID, secondCode:code || undefined};
        S.stage = 'credential';
        render();
      } else {
        var target = getUser(f.uuid);
        if (target){
          target.name = name;
          if (!target.isMe) target.type = f.type;
        }
        S.stage = null;
        toast('已保存');
        render();
      }
    }, 450);
  }

  function saveReset(){
    var r = S.reset;
    if (!r) return;
    var u = getUser(r.uuid);
    if (!u || u.isMe) return;
    if (r.mode === 'manual' && !r.code){ r.error = '请输入新的二次码'; render(); return; }
    if (S.sim){ r.error = simMessage(); render(); return; }
    if (r.mode === 'clear'){
      u.secondCode = undefined;
      S.stage = null;
      toast('已清除二次码');
      render();
      return;
    }
    var code = r.mode === 'random' ? randomCode(12) : r.code;
    u.secondCode = code;
    S.credential = {mode:'reset', title:'二次码已重置', name:u.name, type:u.type, pathID:u.pathID, secondCode:code};
    S.stage = 'credential';
    render();
  }

  function confirmDelete(){
    var u = S.deleteId ? getUser(S.deleteId) : null;
    if (!u) return;
    if (u.isMe){ toast('不能删除自己'); return; }
    if (S.sim){ S.deleteError = simMessage(); render(); return; }
    S.users = S.users.filter(function(x){ return x.uuid !== u.uuid; });
    S.deleteId = null;
    S.stage = null;
    toast('已删除「' + u.name + '」');
    render();
  }

  function finishCredential(){
    var c = S.credential;
    S.stage = null;
    S.credential = null;
    toast(c && c.mode === 'reset' ? '二次码已重置' : '用户已创建');
    render();
  }

  function copyAll(){
    var c = S.credential;
    if (!c) return;
    var text = 'pathID: ' + c.pathID;
    if (c.secondCode) text += '\n二次码: ' + c.secondCode;
    copyText(text);
  }

  function retry(){
    S.state = 'loading';
    render();
    setTimeout(function(){
      if (S.state === 'loading'){
        S.state = 'normal';
        render();
      }
    }, 900);
  }

  function onTool(id){
    if (id === 'users'){ openDrawer(); return; }
    toast('原型未接：' + id);
  }

  function onAction(action){
    if (action === 'close-drawer'){ closeDrawer(); return; }
    if (action === 'close-stage'){ S.stage = null; S.deleteId = null; S.deleteError = ''; render(); return; }
    if (action === 'add'){ openCreate(); return; }
    if (action === 'back'){ S.stage = null; render(); return; }
    if (action === 'save-form'){ saveForm(); return; }
    if (action === 'open-reset'){ openReset(); return; }
    if (action === 'save-reset'){ saveReset(); return; }
    if (action === 'finish-credential'){ finishCredential(); return; }
    if (action === 'copy-all'){ copyAll(); return; }
    if (action === 'confirm-delete'){ confirmDelete(); return; }
    if (action === 'retry'){ retry(); return; }
  }

  document.addEventListener('click', function(e){
    var variant = e.target.closest('[data-variant]');
    if (variant){ S.variant = variant.getAttribute('data-variant'); S.stage = null; render(); return; }

    var copy = e.target.closest('[data-copy]');
    if (copy){ copyText(copy.getAttribute('data-copy')); return; }

    var tool = e.target.closest('[data-tool]');
    if (tool){ onTool(tool.getAttribute('data-tool')); return; }

    var edit = e.target.closest('[data-edit]');
    if (edit){ openEdit(edit.getAttribute('data-edit')); return; }

    var del = e.target.closest('[data-del]');
    if (del){ openDelete(del.getAttribute('data-del')); return; }

    var type = e.target.closest('[data-type]');
    if (type && S.form){ S.form.type = type.getAttribute('data-type'); render(); return; }

    var codeMode = e.target.closest('[data-code-mode]');
    if (codeMode && S.form){ S.form.codeMode = codeMode.getAttribute('data-code-mode'); render(); return; }

    var resetMode = e.target.closest('[data-reset-mode]');
    if (resetMode && S.reset){ S.reset.mode = resetMode.getAttribute('data-reset-mode'); render(); return; }

    var act = e.target.closest('[data-act]');
    if (act){ onAction(act.getAttribute('data-act')); }
  });

  document.addEventListener('input', function(e){
    var id = e.target.id;
    if (id === 'f-name' && S.form) S.form.name = e.target.value;
    if (id === 'f-path' && S.form) S.form.pathID = e.target.value;
    if (id === 'f-code' && S.form) S.form.code = e.target.value;
    if (id === 'r-code' && S.reset) S.reset.code = e.target.value;
  });

  $('role').addEventListener('change', function(e){
    S.role = e.target.value;
    S.open = false;
    S.stage = null;
    if (S.role === 'user') toast('普通用户：工具栏不显示用户管理入口');
    render();
  });
  $('state').addEventListener('change', function(e){
    S.state = e.target.value;
    S.stage = null;
    S.open = S.state !== 'normal';
    render();
  });
  $('variant').addEventListener('change', function(e){
    S.variant = e.target.value;
    S.stage = null;
    render();
  });
  $('sim').addEventListener('change', function(e){
    S.sim = e.target.value;
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (S.stage){ S.stage = null; S.deleteId = null; S.deleteError = ''; render(); return; }
    if (S.open){ closeDrawer(); }
  });

  render();
})();
</script>
</body>
</html>
