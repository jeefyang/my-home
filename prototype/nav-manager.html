<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 · 导航管理（A/B/C/D）</title>
<style>
  :root{
    --bg:#1d2230; --panel:#fff; --ink:#1f2430; --muted:#7b8496; --line:#e6e8ee;
    --brand:#2080f0; --danger:#d03050; --ok:#18a058; --soft:#f5f7fa; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 24px 72px}
  .protohint{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#9aa6bf;font-size:12px;letter-spacing:.3px}
  .phone{position:relative;width:390px;height:780px;max-height:calc(100vh - 96px);background:#fff;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.45);transition:width .25s}
  .phone.wide{width:760px}
  .topbar{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#fff}
  .brand{font-weight:600;font-size:15px}
  .content{flex:1;overflow:auto;background:var(--soft);padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:14px}
  .card p{margin:0;color:var(--muted);font-size:12px}
  .bottom{flex:0 0 50px;height:50px;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;border-top:1px solid var(--line);background:#fff;scrollbar-width:none}
  .bottom::-webkit-scrollbar{display:none}
  .navBtn{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;padding:4px 2px;font-size:10px;color:var(--muted);min-width:0;cursor:pointer}
  .navBtn.active{color:var(--brand)}
  .navBtn .navicon{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
  .navBtn .navicon svg{width:20px;height:20px}
  .navBtn .navtitle{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage{position:absolute;inset:0;display:none;z-index:20}
  .stage.open{display:block}
  .scrim{position:absolute;inset:0;background:rgba(15,18,26,.45)}
  .panel{position:absolute;left:0;right:0;bottom:0;top:0;background:#fff;display:flex;flex-direction:column}
  .panel.sheet{top:auto;height:72%;border-radius:16px 16px 0 0;overflow:hidden}
  .panel.modal{left:16px;right:16px;top:12%;bottom:12%;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .phead{flex:0 0 48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
  .phead .spacer{flex:1}
  .pbody{flex:1;overflow:auto;padding:10px 12px}
  .pfoot{flex:0 0 auto;padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fff}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.danger{color:var(--danger);border-color:#f3c1cc}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.icon{padding:5px 7px;border:0;background:transparent;font-size:14px;line-height:1}
  .row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .ico{width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:8px}
  .row .ico svg{width:20px;height:20px}
  .row .name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ops{display:flex;gap:2px;flex:0 0 auto}
  .muted{color:var(--muted);font-size:12px}
  .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .field label{font-size:12px;color:var(--muted)}
  .input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;width:100%}
  .input.err{border-color:var(--danger)}
  .errmsg{color:var(--danger);font-size:12px;min-height:16px}
  .iconbtn{width:56px;height:56px;border:1px dashed #c9cfda;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .iconbtn svg{width:26px;height:26px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .grid button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center}
  .grid button svg{width:22px;height:22px}
  .grid button.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(32,128,240,.15)}
  .tabs{display:flex;gap:6px;margin:4px 0 10px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%) translateY(10px);background:rgba(20,24,32,.9);color:#fff;font-size:12px;padding:8px 12px;border-radius:8px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:80%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .variantbar{position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:6px;border-radius:12px;backdrop-filter:blur(6px);z-index:100}
  .variantbar button{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#cfd8ea;font-size:13px;font-weight:600}
  .variantbar button.on{background:#fff;color:#1f2430}
  .variantbar label{color:#cfd8ea;font-size:11px;display:flex;align-items:center;gap:4px;margin:0 4px}
  .debug{position:fixed;left:16px;bottom:14px;max-width:420px;max-height:180px;overflow:auto;background:rgba(10,13,20,.75);color:#9fe3b3;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;font:11px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;z-index:100}
  .mini{display:flex;align-items:center;gap:8px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  .mini .ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:7px}
  .mini .ico svg{width:18px;height:18px}
  .mini .name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cards{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x mandatory}
  .navcard{flex:0 0 132px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px;position:relative}
  .navcard .ico{width:36px;height:36px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center}
  .navcard .ico svg{width:24px;height:24px}
  .navcard .name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navcard .x{position:absolute;right:4px;top:2px;border:0;background:transparent;color:var(--muted)}
  .navcard.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-size:13px}
  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
  .table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .table tr:hover td{background:#fafbfd}
  .table .ops{white-space:nowrap}
  .table .ico{width:26px;height:26px;border-radius:7px;background:var(--soft);display:flex;align-items:center;justify-content:center}
  .table .ico svg{width:18px;height:18px}
  .dirtybar{display:flex;align-items:center;gap:8px;font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:4px}
  .sheetprev{background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:var(--muted)}
  .prevnav{display:flex;gap:4px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .prevnav::-webkit-scrollbar{display:none}
  .prevbtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted)}
  .prevbtn svg{width:18px;height:18px}
  .prevbtn.active{border-color:var(--brand);color:var(--brand)}
  .prevbtn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="protohint">原型 · 只用于讨论交互，不是正式代码；底部 A/B/C/D 切换方案</div>
<div class="phone" id="phone">
  <div class="topbar"><span class="brand">My Home</span><button class="btn ghost" id="manageBtn">导航设置</button></div>
  <div class="content" id="pageContent"></div>
  <nav class="bottom" id="bottomNav"></nav>
  <div class="stage" id="stage"></div>
  <div class="toast" id="toast"></div>
</div>
<div class="variantbar" id="variantbar"></div>
<pre class="debug" id="debug"></pre>

<script>
(function(){
  "use strict";
  const SVG = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9Z"/></svg>',
    book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 3.5C19 15.4 12 20 12 20Z"/></svg>',
    folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
    music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
    camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-2h6l2 2h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4Z"/></svg>',
    calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 0-8 5.5 5.5 0 0 1 10.5 1.5A3.5 3.5 0 0 1 17 18Z"/></svg>'
  };
  const CATALOG = [
    {id:'home',name:'首页',svg:SVG.home},{id:'star',name:'收藏',svg:SVG.star},
    {id:'book',name:'书签',svg:SVG.book},{id:'search',name:'搜索',svg:SVG.search},
    {id:'gear',name:'设置',svg:SVG.gear},{id:'heart',name:'喜欢',svg:SVG.heart},
    {id:'folder',name:'目录',svg:SVG.folder},{id:'music',name:'音乐',svg:SVG.music},
    {id:'camera',name:'相机',svg:SVG.camera},{id:'chat',name:'聊天',svg:SVG.chat},
    {id:'calendar',name:'日历',svg:SVG.calendar},{id:'cloud',name:'云',svg:SVG.cloud}
  ];
  const EMOJIS = ['🏠','⭐','📚','🔍','⚙️','❤️','📁','🎵','📷','💬','📅','☁️','🚀','🎯','🧭','🛠️'];
  const CHARS = ['首','书','影','音','设','记','图','站','搜','云','家','工'];

  let S = {
    pages: [
      {id:'p1', title:'首页', icon:'home'},
      {id:'p2', title:'书签', icon:'book'},
      {id:'p3', title:'搜索', icon:'search'},
      {id:'p4', title:'影音', icon:'music'},
      {id:'p5', title:'相册', icon:'camera'},
      {id:'p6', title:'效率', icon:'calendar'},
      {id:'p7', title:'设置', icon:'gear'}
    ],
    active:'p1',
    variant:'A',
    fail:false,
    stage:null,       // null | {type}
    draft:null,       // 批量模式下的一份副本
    dirty:false,
    editor:null,      // {mode:'add'|'edit', id, title, icon, tab}
    picker:null,      // {tab, target}
    confirmId:null
  };

  const $ = (s)=>document.querySelector(s);
  const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const clone = (v)=>JSON.parse(JSON.stringify(v));
  const pageById = (id)=> (S.draft||S.pages).find(p=>p.id===id);
  const iconHtml = (icon)=>{
    if(!icon) return '<span style="font-size:16px;color:#b8c0cf">?</span>';
    if(icon.startsWith('<')) return icon;
    const c = CATALOG.find(x=>x.id===icon);
    if(c) return c.svg;
    return '<span style="font-size:18px;line-height:1">'+esc(icon)+'</span>';
  };
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }

  function navWidth(){ const n=S.pages.length; return n<=5 ? (100/n) : 20; }

  function renderNav(){
    const nav=$('#bottomNav');
    nav.innerHTML = S.pages.map(p=>{
      const active = p.id===S.active ? ' active':'';
      return '<button class="navBtn'+active+'" data-nav="'+p.id+'" style="width:'+navWidth()+'%">'
        +'<span class="navicon">'+iconHtml(p.icon)+'</span>'
        +'<span class="navtitle">'+esc(p.title)+'</span></button>';
    }).join('');
    nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ S.active=b.dataset.nav; render(); });
  }

  function renderContent(){
    const p = S.pages.find(x=>x.id===S.active) || S.pages[0];
    $('#pageContent').innerHTML = '<div class="card"><h3>'+esc(p?p.title:'')+'</h3><p>当前页内容区（原型占位）。底部导航共 '+S.pages.length+' 项，'+(S.pages.length<=5?'均分':'横向滑动')+'。</p></div>'
      +'<div class="card"><h3>提示</h3><p>点右上「导航设置」打开这一屏的原型；底部 A/B/C/D 切换四种管理方案。</p></div>';
  }

  // ============ 通用编辑对话框（A/B/C 共用，D 用行内） ============
  function openEditor(mode, id){
    const p = id ? clone(pageById(id)) : {id:'p'+Date.now(),title:'',icon:'home',isDefault:false};
    S.editor = {mode, id, title:p.title, icon:p.icon, tab:'图标', error:''};
    render();
  }
  function editorOverlay(){
    const e=S.editor;
    const tabs = ['图标','emoji','单字'];
    const grid = e.tab==='图标'
      ? CATALOG.map(c=>'<button data-pick="'+c.id+'" class="'+(e.icon===c.id?'sel':'')+'" title="'+esc(c.name)+'">'+c.svg+'</button>').join('')
      : (e.tab==='emoji'?EMOJIS:CHARS).map(v=>'<button data-pick="'+esc(v)+'" class="'+(e.icon===v?'sel':'')+'" style="font-size:20px">'+esc(v)+'</button>').join('');
    return '<div class="panel modal">'
      +'<div class="phead">'+(e.mode==='add'?'新增导航':'编辑导航')+'<span class="spacer"></span><button class="btn icon" data-act="close">✕</button></div>'
      +'<div class="pbody">'
      +  '<div class="field"><label>标题（1–20 字）</label><input class="input'+(e.error?' err':'')+'" id="titleInput" value="'+esc(e.title)+'" maxlength="20" placeholder="例如：收藏"></div>'
      +  '<div class="errmsg">'+esc(e.error)+'</div>'
      +  '<div class="field" style="flex-direction:row;align-items:center;gap:12px"><button class="iconbtn" id="openPicker">'+iconHtml(e.icon)+'</button><div class="muted">点击预览换图标<br>纯 emoji 或单个汉字也可以</div></div>'
      +  '<div class="tabs">'+tabs.map(t=>'<button data-tab="'+t+'" class="'+(e.tab===t?'on':'')+'">'+t+'</button>').join('')+'</div>'
      +  '<div class="grid">'+grid+'</div>'
      +'</div>'
      +'<div class="pfoot"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="save" style="flex:1">保存</button></div>'
      +'</div>';
  }
  function wireEditor(root){
    const e=S.editor; if(!e) return;
    const ti=root.querySelector('#titleInput');
    if(ti){ ti.oninput=(ev)=>{ e.title=ev.target.value; e.error=''; }; }
    root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ e.tab=b.dataset.tab; render(); });
    root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ e.icon=b.dataset.pick; render(); });
    const op=root.querySelector('#openPicker'); if(op) op.onclick=()=>{ e.tab='图标'; render(); };
    root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
      const act=b.dataset.act;
      if(act==='close'){ S.editor=null; render(); return; }
      if(act==='save') saveEditor();
    });
  }
  function saveEditor(){
    const e=S.editor;
    const title=(e.title||'').trim();
    if(!title){ e.error='标题不能为空'; render(); return; }
    if(title.length>20){ e.error='标题最多 20 个字'; render(); return; }
    const icon=e.icon||'';
    if(!icon.startsWith('<') && [...icon].length>4){ e.error='emoji / 单字最多 4 个字符'; render(); return; }
    const apply=(mut)=>{
      if(S.fail){ toast('保存失败，已回滚'); render(); return; }
      mut();
    };
    if(e.mode==='add'){
      const np={id:'p'+Date.now(),title,icon,isDefault:false};
      apply(()=>{ targetPages().push(np); S.active=np.id; });
      S.editor=null; S.dirty=!!S.draft; toast('已新增「'+title+'」'); render(); return;
    }
    apply(()=>{ const p=pageById(e.id); if(p){ p.title=title; p.icon=icon; } });
    S.editor=null; S.dirty=!!S.draft; toast('已保存'); render();
  }
  function targetPages(){ return S.draft || S.pages; }

  // ============ 删除 ============
  function deletePage(id){
    const list=targetPages();
    if(list.length<=1){ toast('至少保留一个页面'); return; }
    const idx=list.findIndex(p=>p.id===id);
    if(idx<0) return;
    if(S.fail){ toast('删除失败，已回滚'); return; }
    list.splice(idx,1);
    if(S.active===id){
      const next=list[Math.min(idx,list.length-1)];
      S.active=next.id;
      toast('已删除，切到「'+next.title+'」');
    } else toast('已删除');
    S.dirty=!!S.draft;
    render();
  }
  function move(id,dir){
    const list=targetPages(); const i=list.findIndex(p=>p.id===id); if(i<0) return;
    const j=i+dir; if(j<0||j>=list.length) return;
    [list[i],list[j]]=[list[j],list[i]];
    S.dirty=!!S.draft; render();
  }

  // ============ 变体 A：全屏管理页 ============
  function renderA(){
    const list=targetPages();
    return '<div class="panel">'
      +'<div class="phead"><button class="btn icon" data-act="back">←</button>导航管理<span class="spacer"></span><span class="muted">'+list.length+' 页</span></div>'
      +'<div class="pbody">'+list.map((p,i)=>
          '<div class="row"><div class="ico">'+iconHtml(p.icon)+'</div><div class="name">'+esc(p.title)+'</div>'
          +'<div class="ops">'
          +'<button class="btn icon" data-move="'+p.id+'|-1" '+(i===0?'disabled':'')+'>↑</button>'
          +'<button class="btn icon" data-move="'+p.id+'|1" '+(i===list.length-1?'disabled':'')+'>↓</button>'
          +'<button class="btn icon" data-edit="'+p.id+'">✎</button>'
          +'<button class="btn icon" data-del="'+p.id+'" '+(list.length<=1?'disabled':'')+'>🗑</button>'
          +'</div></div>').join('')
      +'</div>'
      +'<div class="pfoot"><button class="btn primary" data-act="add" style="flex:1">＋ 新增导航</button></div>'
      +'</div>';
  }
  // ============ 变体 B：居中弹窗 + 行内编辑 + 批量保存 ============
  function renderB(){
    const list=targetPages();
    return '<div class="panel modal">'
      +'<div class="phead">导航管理<span class="spacer"></span><span class="muted">'+(S.dirty?'<span class="dot"></span>未保存':'已保存')+'</span></div>'
      +'<div class="pbody">'+list.map((p,i)=>
          '<div class="mini"><div class="ico">'+iconHtml(p.icon)+'</div><div class="name" data-bedit="'+p.id+'" style="cursor:pointer">'+esc(p.title)+'</div>'
          +'<button class="btn icon" data-move="'+p.id+'|-1" '+(i===0?'disabled':'')+'>↑</button>'
          +'<button class="btn icon" data-move="'+p.id+'|1" '+(i===list.length-1?'disabled':'')+'>↓</button>'
          +'<button class="btn icon" data-del="'+p.id+'" '+(list.length<=1?'disabled':'')+'>🗑</button></div>'
        ).join('')+'</div>'
      +'<div class="pfoot"><button class="btn" data-act="add">＋ 新增</button><button class="btn" data-act="discard" '+(S.dirty?'':'disabled')+'>放弃</button><button class="btn primary" data-act="commit" style="flex:1" '+(S.dirty?'':'disabled')+'>保存更改</button></div>'
      +'</div>';
  }
  // ============ 变体 C：底部抽屉 + 实时预览 + 即时保存 ============
  function renderC(){
    const list=targetPages();
    return '<div class="panel sheet">'
      +'<div class="phead">导航管理<span class="spacer"></span><span class="muted">'+list.length+' 页</span><button class="btn icon" data-act="back">✕</button></div>'
      +'<div class="pbody">'
      +'<div class="sheetprev"><div class="prevnav">'+list.map(p=>'<button class="prevbtn'+(p.id===S.active?' active':'')+'" data-prev="'+p.id+'" style="width:'+(list.length<=5?(100/list.length):20)+'%">'+iconHtml(p.icon)+'<span>'+esc(p.title)+'</span></button>').join('')+'</div><div class="muted" style="margin-top:6px">上方是底部导航预览（'+(list.length<=5?'≤5 均分':'&gt;5 横向滑动')+'，点选切页）；卡片可横向滑动。</div></div>'
      +'<div class="cards">'+list.map(p=>'<div class="navcard"><button class="x" data-del="'+p.id+'" '+(list.length<=1?'disabled':'')+'>✕</button><div class="ico">'+iconHtml(p.icon)+'</div><div class="name">'+esc(p.title)+'</div><button class="btn" data-edit="'+p.id+'" style="padding:4px 8px;font-size:12px">编辑</button></div>').join('')
      +'<div class="navcard add" data-act="add">＋<br>新增</div></div>'
      +'<div class="muted">卡片可横向滑动；桌面端也按手机宽度处理。删除后自动切到相邻页。</div>'
      +'</div></div>';
  }
  // ============ 变体 D：紧凑表格 + 批量保存（桌面优先） ============
  function renderD(){
    const list=targetPages();
    return '<div class="panel">'
      +'<div class="phead">导航管理<span class="spacer"></span><span class="muted dirtybar">'+(S.dirty?'<span><span class="dot"></span>有未保存修改</span>':'已保存')+'</span></div>'
      +'<div class="pbody">'
      +'<table class="table"><thead><tr><th style="width:36px">图标</th><th>标题</th><th style="width:88px">排序</th><th style="width:96px">操作</th></tr></thead><tbody>'
      +list.map((p,i)=>'<tr><td><div class="ico">'+iconHtml(p.icon)+'</div></td><td><input class="input" data-dtitle="'+p.id+'" value="'+esc(p.title)+'" style="height:30px"></td>'
        +'<td class="ops"><button class="btn icon" data-move="'+p.id+'|-1" '+(i===0?'disabled':'')+'>↑</button><button class="btn icon" data-move="'+p.id+'|1" '+(i===list.length-1?'disabled':'')+'>↓</button></td>'
        +'<td class="ops"><button class="btn icon" data-edit="'+p.id+'">图标</button><button class="btn icon" data-del="'+p.id+'" '+(list.length<=1?'disabled':'')+'>删除</button></td></tr>').join('')
      +'</tbody></table></div>'
      +'<div class="pfoot"><button class="btn" data-act="add">＋ 新增</button><button class="btn" data-act="discard" '+(S.dirty?'':'disabled')+'>放弃</button><button class="btn primary" data-act="commit" style="flex:1" '+(S.dirty?'':'disabled')+'>保存更改</button></div>'
      +'</div>';
  }

  // ============ 渲染主循环 ============
  function render(){
    const phone=$('#phone');
    phone.classList.toggle('wide', S.variant==='D');
    renderNav();
    renderContent();
    const stage=$('#stage');
    let inner='';
    if(S.stage==='manager'){
      if(S.variant==='A') inner=renderA();
      else if(S.variant==='B') inner=renderB();
      else if(S.variant==='C') inner=renderC();
      else inner=renderD();
    }
    if(S.editor) inner = editorOverlay();
    stage.innerHTML = inner ? '<div class="scrim"></div>'+inner : '';
    stage.classList.toggle('open', !!inner);
    wire();
    renderVariantBar();
    renderDebug();
  }

  function wire(){
    $('#manageBtn').onclick=openManager;
    document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ S.active=b.dataset.nav; render(); });
    document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{ S.active=b.dataset.prev; render(); });
    $('#stage').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.act;
      if(a==='back'){ S.stage=null; S.draft=null; S.dirty=false; S.editor=null; render(); }
      if(a==='add'){ S.editor={mode:'add',id:null,title:'',icon:'home',tab:'图标',error:''}; render(); }
      if(a==='commit'){ if(S.fail){ toast('保存失败，修改保留，可重试'); return; } S.pages=clone(S.draft); S.draft=null; S.dirty=false; S.stage=null; S.editor=null; toast('已保存'); render(); }
      if(a==='discard'){ S.draft=clone(S.pages); S.dirty=false; S.editor=null; toast('已放弃修改'); render(); }
    });
    $('#stage').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor('edit',b.dataset.edit));
    $('#stage').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('删除「'+pageById(b.dataset.del).title+'」？')) deletePage(b.dataset.del); });
    $('#stage').querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{ const [id,d]=b.dataset.move.split('|'); move(id,Number(d)); });
    if(S.editor) wireEditor($('#stage'));
    // B 的行内编辑
    const be=$('#stage').querySelectorAll('[data-bedit]');
    be.forEach(el=>el.onclick=()=>{ S.editor={mode:'edit',id:el.dataset.bedit,title:pageById(el.dataset.bedit).title,icon:pageById(el.dataset.bedit).icon,tab:'图标',error:''}; render(); });
    // D 行内标题
    $('#stage').querySelectorAll('[data-dtitle]').forEach(inp=>inp.oninput=()=>{ const p=pageById(inp.dataset.dtitle); if(p){ p.title=inp.value; S.dirty=true; }
      const bar=$('#stage').querySelector('.dirtybar'); if(bar) bar.innerHTML='<span><span class="dot"></span>有未保存修改</span>';
      $('#stage').querySelectorAll('[data-act="commit"],[data-act="discard"]').forEach(b=>b.disabled=false);
      renderDebug(); });
  }

  function renderVariantBar(){
    const bar=$('#variantbar');
    bar.innerHTML = ['A','B','C','D'].map(v=>'<button data-v="'+v+'" class="'+(S.variant===v?'on':'')+'">'+v+'</button>').join('')
      +'<label><input type="checkbox" id="failToggle" '+(S.fail?'checked':'')+'> 模拟保存失败</label>';
    bar.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ S.variant=b.dataset.v; S.stage=null; S.draft=null; S.editor=null; S.dirty=false; history.replaceState(null,'','?v='+S.variant); render(); });
    const ft=$('#failToggle'); ft.onchange=()=>{ S.fail=ft.checked; toast(S.fail?'已开启失败模拟':'已关闭失败模拟'); render(); };
  }
  function renderDebug(){
    $('#debug').textContent = 'variant='+S.variant+'  fail='+S.fail+'  active='+S.active+'\n'
      +'pages['+S.pages.length+']: '+S.pages.map(p=>p.title+'('+p.id+')').join(' / ')+'\n'
      +(S.draft?('draft['+S.draft.length+']: '+S.draft.map(p=>p.title).join(' / ')+'\n'):'')
      +(S.editor?('editor='+S.editor.mode+' title="'+S.editor.title+'" icon='+S.editor.icon+'\n'):'')
      +(S.dirty?'dirty=true':'dirty=false');
  }

  function openManager(){ S.stage='manager'; S.draft=(S.variant==='B'||S.variant==='D')?clone(S.pages):null; S.dirty=false; S.editor=null; render(); }

  // 初始化
  const params = new URLSearchParams(location.search);
  const q = params.get('v');
  if(q && ['A','B','C','D'].includes(q.toUpperCase())) S.variant=q.toUpperCase();
  const open = params.get('open');
  if(open==='manager') openManager();
  else if(open==='editor'){ S.stage='manager'; S.draft=(S.variant==='B'||S.variant==='D')?clone(S.pages):null; openEditor('edit','p2'); }
  else render();
})();
</script>
</body>
</html>
